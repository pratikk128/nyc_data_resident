# The data refresh (scripts/run-etl.mjs): checks every dataset on NYC Open
# Data, rebuilds the summaries that are due and writes them to Workers KV
# (and the crash sync to D1). It runs here, not as a Worker cron, because a
# refresh needs far more CPU and subrequests than the Workers free plan allows.
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with Workers KV Storage: Edit and D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  the account the Worker is deployed to
#   SOCRATA_APP_TOKEN      optional, raises NYC Open Data's rate limits
# Repository variable:
#   KV_NAMESPACE_ID        the DATA_CACHE namespace (`npx wrangler kv namespace list`)
name: Data refresh

on:
  schedule:
    - cron: "17 */12 * * *" # every 12 hours; src/lib/etl/cadence.js decides what's rebuilt
  workflow_dispatch:

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run etl -- --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
